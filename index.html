<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday, Nour! ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0d17;
      --card-bg: rgba(22, 26, 45, 0.72);
      --border-glow: rgba(255, 215, 130, 0.28);
      --gold: #ffd166;
      --gold-deep: #f4a261;
      --rose: #ff758f;
      --text-main: #f8f9fa;
      --text-muted: #b8c0d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1b2240 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 2rem 1rem;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .ambient-glow {
      position: fixed;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.14), transparent 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
    }

    .hero-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glow);
      border-radius: 28px;
      padding: 3rem 2.25rem;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(255, 209, 102, 0.08);
      animation: fadeUp 0.9s ease-out forwards;
    }

    .badge {
      display: inline-block;
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.35);
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 5vw, 3.3rem);
      line-height: 1.15;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }

    .highlight {
      background: linear-gradient(135deg, #fff3b0 0%, var(--gold) 50%, var(--rose) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: clamp(2.8rem, 6.5vw, 4.1rem);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 480px;
      margin: 0 auto 2rem;
    }

    .cake-container {
      margin: 1.5rem auto 2rem;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .candle {
      position: relative;
      width: 12px;
      height: 36px;
      background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 5px,
        var(--rose) 5px,
        var(--rose) 10px
      );
      border-radius: 4px 4px 0 0;
    }

    .flame {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 22px;
      background: radial-gradient(circle at 50% 80%, #fff 10%, var(--gold) 55%, #ff6b35 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 0 0 18px var(--gold), 0 0 35px rgba(255, 165, 0, 0.7);
      animation: flicker 0.18s infinite alternate;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
      animation: none;
    }

    .smoke {
      position: absolute;
      top: -26px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(220, 225, 240, 0.6);
      opacity: 0;
      pointer-events: none;
    }

    .smoke.active {
      animation: riseSmoke 1.4s ease-out forwards;
    }

    .cake-top {
      width: 110px;
      height: 22px;
      background: linear-gradient(180deg, #ffccd5, #ff8fa3);
      border-radius: 10px 10px 4px 4px;
      box-shadow: 0 4px 0 #e05780;
    }

    .cake-base {
      width: 130px;
      height: 34px;
      background: linear-gradient(180deg, #3d2c4e, #281c36);
      border-radius: 6px 6px 12px 12px;
      border-top: 3px solid var(--gold);
    }

    .hint {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--gold);
      opacity: 0.85;
    }

      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding
